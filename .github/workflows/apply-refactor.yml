name: Apply Phase1+2 Refactor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install

      - name: Wire Auth (Phase 2)
        run: node scripts/wire-phase2-app.mjs

      - name: Remove Phase1 duplicates (AST)
        run: npx tsx scripts/ast-remove-phase1.ts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Commit and push App.tsx
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/main.tsx
          if git diff --staged --quiet; then
            echo "Nenhuma mudanca para commit"
          else
            git commit -m "refactor: wire App to Phase1 modules and AuthProvider (CI)"
            git push origin HEAD:main
          fi
